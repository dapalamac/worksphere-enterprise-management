name: WorkSphere Backend CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Packages
        run: dotnet restore WorkSphere.slnx

      - name: Build Solution
        run: dotnet build WorkSphere.slnx --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test WorkSphere.slnx --configuration Release --no-build

      - name: Publish API
        run: dotnet publish WorkSphere.Api/WorkSphere.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkSphere-API
          path: ./publish






